# URDF의 한계를 덮어쓰거나 보탠다.
#
# 기본 배율을 0.35로 둔 이유는 전시다. 사람 옆에서 도는 협동로봇이 최대
# 속도로 움직이면 관람객이 물러선다. 사이클 20초 안에 들어오는 선에서
# 가장 느리게 잡는다. 실측 후 조정할 값이다(기획서 E6 사이클 타임 측정).
#
# max_acceleration은 기종의 능력으로 둔다. 처음에 2.0으로 낮춰 잡았더니
# Pilz LIN이 만든 직교 경로가 그 한계를 넘어 계획 자체가 실패했다
# ("Joint acceleration limit of j1 violated"). 느리게 보이게 하는 일은
# 한계가 아니라 위의 배율이 해야 한다. 한계를 깎으면 계획이 죽는다.
default_velocity_scaling_factor: 0.35
default_acceleration_scaling_factor: 0.35

# j2와 j4의 각도 범위를 좁힌다. 이게 이 셀에서 가장 중요한 설정이다.
#
# FR5는 같은 TCP 지점에 여러 관절 자세로 갈 수 있다. 그런데 그 자세들이
# 등가가 아니다. 적재 자리 상공에 도착한 뒤 바로 아래로 내려가는 직선
# (compute_cartesian_path)이 어떤 자세에서는 100% 풀리고 어떤 자세에서는
# 42~62%에서 끊긴다. 끊기면 로봇은 박스를 든 채 멈추고, 실패 처리가 박스를
# 그 자리에 떨군다.
#
# 18개 목표(팔레트 2장 x 4자리 x 2층, 판독 자리, 예외 통)마다 무작위 시드로
# IK를 여러 번 풀어 하강이 100% 풀리는 해만 모아 봤다. 그 해들의 범위다.
#
#     j1  -168.6 ~ +163.7      j4   -95.4 ~  -84.5
#     j2  -110.6 ~  -69.3      j5   -90.0 ~  +90.0
#     j3  -111.4 ~ +111.4      j6  -116.6 ~ +139.0
#
# j1, j3, j5, j6은 좌우 대칭 해가 둘 다 되므로 범위가 넓다. 가려 주는 것은
# j2와 j4뿐이다. 실패한 해들의 값은 전부 이 밖이었다.
#
#     실패 j2 : -180.2, -136.7, -15.2      실패 j4 : -170.9, +75.7, -225.4
#
# 그래서 j2와 j4만 묶는다. 대기 자세(j2=-90, j4=-90)도 안에 있다.
#
# 범위는 성공 해의 범위보다 넉넉히 잡아야 한다. 위 숫자는 상공에 도착한
# 순간의 자세일 뿐이고, 거기서 아래로 내려가는 동안 관절이 더 돌기 때문이다.
# 처음에 j4를 [-110, -70]으로 조였더니 하강이 53%에서 멈췄고, 멈춘 지점의
# j4가 정확히 -70.0이었다. 한계에 걸린 것이다. 그래서 아래처럼 연다.
#
#     j2  [-130, -35]   실패 해의 -180.2, -136.7, -15.2를 모두 배제
#     j4  [-115, +20]   실패 해의 -170.9, +75.7, -225.4를 모두 배제
#
# 실물 팔레타이저도 이렇게 쓴다. 로봇을 한 자세 계열에 묶어 두어야 같은
# 자리에 늘 같은 모양으로 가고, 사이클마다 궤적이 달라지지 않는다.
joint_limits:
  j1: {has_velocity_limits: true, max_velocity: 3.15, has_acceleration_limits: true, max_acceleration: 5.0}
  j2: {has_velocity_limits: true, max_velocity: 3.15, has_acceleration_limits: true, max_acceleration: 5.0,
       has_position_limits: true, min_position: -2.2689, max_position: -0.6109}
  j3: {has_velocity_limits: true, max_velocity: 3.15, has_acceleration_limits: true, max_acceleration: 5.0}
  j4: {has_velocity_limits: true, max_velocity: 3.20, has_acceleration_limits: true, max_acceleration: 8.0,
       has_position_limits: true, min_position: -2.0071, max_position: 0.3491}
  # j5의 부호도 묶는다. 작동 계열은 +90이고 거울상은 -90이다. 부호만 달라도
  # 적재 하강이 60%에서 끊긴다(실측). 대기 자세도 +90으로 옮겨 두었다.
  j5: {has_velocity_limits: true, max_velocity: 3.20, has_acceleration_limits: true, max_acceleration: 8.0,
       has_position_limits: true, min_position: 0.3491, max_position: 2.7925}
  j6: {has_velocity_limits: true, max_velocity: 3.20, has_acceleration_limits: true, max_acceleration: 8.0}
