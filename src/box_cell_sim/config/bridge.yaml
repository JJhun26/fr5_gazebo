# ros_gz_bridge 설정. Gazebo와 ROS2 사이를 오가는 것 전부.
#
# 영상은 여기서 다루지 않는다. ros_gz_image의 image_bridge가 따로 맡는다.
# 파라미터 브리지로도 되지만 프레임마다 한 번씩 복사가 더 생긴다.
# 1920x1080 30 Hz 카메라가 네 대다. 그 복사가 그냥 낭비가 아니다.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# 박스의 실제 자세. box_spawner가 받아 /sim/boxes로 다시 낸다.
#
# 월드의 dynamic_pose/info를 쓰지 않는 이유가 있다. 그 토픽을 TFMessage로
# 브리지하면 child_frame_id가 빈 채로 온다. 변환기가 gz Pose의 name이 아니라
# 헤더 data 항목을 보는데, SceneBroadcaster는 그것을 채우지 않기 때문이다.
# 박스마다 붙인 PosePublisher는 채워 주므로 이름이 살아서 넘어온다.

# 벨트 표면 속도 (m/s).
#
# gz의 TrackController가 이 값을 받아 벨트 링크의 접촉 표면에 속도를 준다.
# 링크는 움직이지 않고 표면만 흐른다. 실물 벨트와 같다.
#
# ApplyLinkWrench로 박스를 미는 방식은 못 쓴다. gz에서 정지한 물체는 건 힘을
# 받지 않는다(벨트에 서 있는 박스는 50 N에도 꿈쩍 않고, 같은 20 N을 공중에서
# 떨어지는 박스에 걸면 1.4 m를 날아간다. 실측).
- ros_topic_name: "/conveyor/belt_speed"
  gz_topic_name: "/conveyor/belt_speed"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

# 카메라 내부 파라미터. 영상과 달리 작고, pose_resolver가 반드시 봐야 한다.
# gz가 이 이름으로 내도록 센서 토픽을 "<카메라>/color/image"로 잡아 두었다.
# realsense_macro.xacro의 주석 참고.
- ros_topic_name: "/c1_conveyor/color/camera_info"
  gz_topic_name: "/c1_conveyor/color/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

