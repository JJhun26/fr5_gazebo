  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# 깊이 포인트클라우드. C2는 적층 붕괴 감지에, C4는 근접 확인에 쓴다.
- ros_topic_name: "/c2_pallet/depth/points"
  gz_topic_name: "/c2_pallet/depth/image/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

