# =============================================================================
# box_cell -- 셀 제원 단일 원본 (single source of truth)
#
# 출처: 물류로봇데모_기획서 "3. 셀 구성 / 확정 제원", "배치와 도달 검증",
#       "5.3 팔레타이징", "5.4 비전".
# 단위: m, rad, kg  (기획서는 mm 표기이므로 주석에 원문 값을 남긴다)
#
# 이 파일 하나를 URDF(xacro)와 ROS2 노드가 함께 읽는다.
#   - xacro : ${xacro.load_yaml('.../cell.yaml')}
#   - node  : box_cell_logic.cell_geometry.load()
# 하드웨어 도착 후 재티칭할 값은 tuning: 아래에만 모아 둔다.
# =============================================================================

meta:
  name: box_cell
  revision: "2026-09-07"
  source: "물류로봇데모_기획서 2.pdf"

# -----------------------------------------------------------------------------
# 좌표계
#   world  : Gazebo 월드. 바닥 z=0.
#   table  : 상판 좌표계. 원점 = 상판 좌측 하단 모서리, 상판 상면.
#            +x = 폭 1200 방향, +y = 깊이 800 방향, +z = 위.
#   기획서의 모든 (x, y)는 table 좌표계 mm 값이다.
# -----------------------------------------------------------------------------
frame:
  table_top_height: 0.750        # 상판 상면 높이 H750

# -----------------------------------------------------------------------------
# 상판과 프레임
# -----------------------------------------------------------------------------
table:
  size_x: 1.200                  # 1200
  size_y: 0.800                  # 800
  top_thickness: 0.030
  # 받침 개구: 배선과 티칭 여유 때문에 300 각에서 400 각으로 정정된 값
  opening:
    center: [0.405, 0.311]       # 로봇 중심과 동심
    size: 0.400                  # 400 각
  leg:
    section: 0.050
    inset: 0.060
  shelf_height: 0.350            # 하단 선반
  caster_radius: 0.050

# -----------------------------------------------------------------------------
# 로봇 -- FAIRINO FR5 (v6). 석션 툴.
# -----------------------------------------------------------------------------
robot:
  model: fr5_v6
  base_center: [0.405, 0.311]    # 로봇 중심 (405, 311)
  base_plate:
    size: 0.220                  # 베이스 220 각
    thickness: 0.012
  mount_yaw: 0.0                 # 베이스 X축이 상판 +x와 일치
  # 1층 작업 기준 도달 고리. 원이 아니라 고리다.
  reach:
    inner: 0.256                 # 내경 256
    outer: 0.884                 # 외경 884

# 툴 -- ES45 진공 그리퍼 (24V I/O, 통신/센서 없음)
tool:
  name: es45
  flange_offset: 0.099           # wrist3_link -> 플랜지면
  adapter_length: 0.022
  body_length: 0.0775
  cup_length: 0.022
  cup_radius: 0.015
  # TCP = wrist3_link + 0.099 + 0.022 + 0.0775 + 0.022 = 0.2205, 전방(+z) 오프셋
  tcp_offset: 0.2205
  mass: 0.27

# -----------------------------------------------------------------------------
# 컨베이어 -- 유효 800 x 폭 150. 기어박스 200 각은 상판 바깥.
# -----------------------------------------------------------------------------
conveyor:
  # 통짜 벨트 컨베이어. 길이 800.
  #
  # 처음에는 구동 롤러 열로 만들었다. gz에서 정지한 물체는 건 힘을 받지
  # 않아 힘으로 미는 방식이 막혔고, 실제로 도는 롤러라야 마찰로 실린다는
  # 이유였다. 그 방식은 돌긴 했지만 대가가 컸다.
  #
  #   60 각 박스가 롤러 위에 기울어 섰다(실측 28도). 흡착 허용 20도를 넘겨
  #   로봇이 헛집었다. 피치를 20까지 줄여 3점 지지로 만들면 기울기는 0이
  #   되는데 롤러가 83개로 늘어 실시간 계수가 1.00에서 0.16으로 떨어졌다.
  #
  # gz의 TrackController가 이 문제를 통째로 없앤다. 궤도 차량용 시스템인데,
  # 하는 일이 "링크 표면에 속도를 주어 접촉한 물체를 마찰로 밀어내는 것"이라
  # 벨트 컨베이어와 정확히 같다. 링크 자체는 움직이지 않는다.
  # 실물 벨트도 그렇다. 프레임은 서 있고 벨트 면만 흐른다.
  #
  # 검증 : 0.8 m 벨트 위 박스가 0.25 m/s로 실려 가 끝에서 떨어졌다.
  belt:
    x_start: 0.000
    x_end: 0.800                 # 컨베이어 끝 x 800
    # 폭. 제일 큰 규격(XL 190x145)이 레일 사이로 여유 있게 지나가야 한다.
    #
    # 150이었을 때 레일 안목이 134밖에 안 돼 XL(145)이 아예 못 들어갔고,
    # L(120)도 여유가 한쪽 7 mm뿐이라 판독 위치가 몇 mm만 치우쳐도 물고
    # 올라오는 순간 레일과 충돌로 잡혀 이탈 직선이 0%에서 끊겼다.
    # 220이면 안목 204, XL 기준 한쪽 29.5 mm가 남는다.
    width: 0.220
    center_y: 0.725              # 상판 깊이 800 - 폭/2
    surface_z: 0.180             # 판독 높이 = 상판 위 180
    thickness: 0.012
    friction: 1.0                # 벨트 고무와 골판지
    mass: 20.0                   # 벨트 판. 안 움직이지만 관성은 있어야 한다.
  side_rail:
    height: 0.045
    thickness: 0.008
  gearbox:
    size: 0.200                  # 200 각
    x_max: 0.000                 # 상판 바깥, x<0
  speed: 0.25                    # m/s, 벨트 표면 속도 (+x)
  # 정지 센서. 박스 중심이 이 x에 오면 벨트를 멈춘다.
  #
  # 판독 자리(405)보다 조금 상류에 둔다. 벨트가 서는 데 시간이 걸려 박스가
  # 조금 더 밀려 가기 때문이다. 실물 라인에서도 광전 센서는 정지 자리보다
  # 코스팅 거리만큼 앞에 단다.
  #
  # 통짜 벨트로 바꾼 뒤 코스팅이 크게 줄었다. 롤러일 때는 10~28 mm였는데
  # 지금은 1~5 mm다(실측 406, 410 mm). 어느 쪽이든 실제 위치는 C1이 보고
  # 판단하므로, 이 값은 박스를 판독 화각 한가운데에 세우는 데까지만 쓴다.
  stop_sensor_x: 0.390
  # 로봇이 디팔레타이징한 박스를 벨트에 올려 놓는 자리. 판독 위치 상류다.
  #
  # 100이었을 때는 어떤 자세로도 못 갔다. 도달 거리 문제가 아니라 C1을
  # 매단 ㄱ자 팔이 x=164에 있어 그 아래가 막힌 것이다. 조명 지주를 걷고
  # 카메라를 바닥에서 올린 프레임으로 바꾸면서 생긴 변화인데, 이 값은
  # 그대로 두어 순환 시나리오가 통째로 안 돌았다. 실측으로
  #   x=200 : 두 방향 다 0%      x=250 : 두 방향 다 100%
  # 250이면 정지 센서(390)보다 상류라 벨트가 정상적으로 밀어 준다.
  infeed_x: 0.250
  # 상류 투입 구간. 벨트와 같은 높이로 이어지는 짧은 인피드 벨트다.
  infeed:
    x_start: -0.300              # 인피드 벨트 상류 끝
    spawn_x: -0.250
    spawn_drop: 0.020

# -----------------------------------------------------------------------------
# 판독 자리
# -----------------------------------------------------------------------------
read_station:
  center: [0.405, 0.725]
  surface_z: 0.180

# -----------------------------------------------------------------------------
# 팔레트 -- 300 x 300 x 30 두 개
# -----------------------------------------------------------------------------
pallet:
  size: 0.300                    # 300 각
  thickness: 0.030               # 30
  paint_zone: 0.200              # 색칠 구역 200 각. 적재 블록은 이 안에 들어간다.
  # 색칠 구역 200 각 안에 2열 2행 2층 = 8개
  slots:
    cols: 2
    rows: 2
    layers: 2
    pitch: 0.070                 # 박스 60 각을 피치 70으로 (간극 10)
    approach_height: 0.060       # 목표 상면 위 60
  units:
    - {id: 1, center: [0.950, 0.210]}   # 로봇 중심에서 554
    - {id: 2, center: [0.950, 0.570]}   # 로봇 중심에서 603

# -----------------------------------------------------------------------------
# 대상물 -- 택배박스 60 x 60 x 40, 8개. 상면 라벨.
# -----------------------------------------------------------------------------
box:
  size: [0.060, 0.060, 0.040]
  mass: 0.35
  count: 8
  label:
    # 상면 중앙 라벨 한 변. 기획서 7절이 "라벨 크기에서 해상도 역산"으로
    # 남겨 둔 값이고, 역산 결과가 이것이다.
    #
    # 40 mm로 시작했다가 50 mm로 키웠다. 40 mm면 C1 화면에서 97 px이고
    # QR 21 모듈이 모듈당 4.6 px인데, 그 크기에서는 렌더러의 밉맵 필터가
    # 모듈을 뭉개 디코드가 통째로 실패한다. 실물 카메라도 렌즈 MTF 때문에
    # 사정이 크게 다르지 않다. 택배 라벨은 원래 이보다 크다.
    size: 0.050
    quiet: 0.0025                # QR 사방 여백
    text_strip: 0.004            # 코드 문자열 인쇄 폭
    kind: qr                     # 바코드 또는 QR. QR 권장 (기획서 7절)

# 예외 통 -- (95, 110). 170 x 160.
exception_bin:
  center: [0.095, 0.110]         # 로봇 중심에서 369
  size: [0.170, 0.160]
  height: 0.120
  wall: 0.006
  drop_height: 0.200             # 통 상단 위 이탈 높이

# -----------------------------------------------------------------------------
# 카메라 갠트리 : 상판 모서리 ㄱ자 프레임
# 기둥 위치는 발주 도면에서 확정된다(기획서 7절 미확정 항목).
# 아래는 도달 고리(외경 884)와 팔레트를 피해 잡은 잠정값이다.
# z는 모두 상판 상면 기준.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# 카메라 지주. 바닥에서 올라와 ㄱ자로 작업 구역 위로 들어온다.
#
# 전에는 상판 위에 세운 갠트리였다. 실물 셀은 바닥에 선 알루미늄 프로파일
# 프레임이고, 상판 위 공간을 기둥이 차지하지 않는다. 팔레트 옆 바닥에서
# 올라와 가로 팔이 컨베이어 쪽으로 뻗고, 그 끝에 카메라가 매달린다.
#
# z 좌표는 전부 상판 상면 기준이다(cell_base). 바닥은 -0.750이다.
#
# 가로 팔 높이 0.960을 그대로 둔 이유가 있다. 이 높이는 로봇이 판독 위치의
# 박스를 집고 팔레트로 나가는 동안 팔이 닿지 않는다는 것을 실측으로 확인한
# 값이다(tools/verify_camera_clearance.py). 낮추면 다시 재야 한다.
# -----------------------------------------------------------------------------
camera_frame:
  section: 0.045                 # 알루미늄 프로파일 45각
  floor_z: -0.750                # 상판 기준 바닥 높이
  arm_z: 0.960                   # 가로 팔 중심 높이
  posts:                         # 팔레트 옆, 상판 바깥 바닥
    - {id: 1, xy: [1.310, 0.725]}   # 판독(C1) 지주. C3도 여기 붙는다.
    - {id: 2, xy: [1.310, 0.390]}   # 팔레트(C2) 지주
  arms:
    - {id: conveyor, y: 0.725, x_min: 0.120, x_max: 1.310}
    - {id: pallet,   y: 0.390, x_min: 0.900, x_max: 1.310}
  drop:
    section: 0.030               # 카메라를 팔에서 내려 다는 브래킷

# -----------------------------------------------------------------------------
# 카메라 4대
#   C1 컨베이어 탑뷰  D435f  : 판독 전담. 이 한 대로 판독이 끝난다.
#   C2 팔레트 탑뷰    D455   : 적재 확인, 디팔레타이징 전 재확인, 적층 붕괴 감지
#   C3 측면/씬        기종 미정 : MES 기록 사진, 트윈/관람 화면 소스
#   C4 손목           D405   : 판독 실패 시 근접 폴백, 집기 직전 확인
#
# stream: 블록은 '시뮬레이터가 실제로 렌더링하는 것'이다. realsense.yaml의
# 30 Hz는 하드웨어 제원이고 그대로 둔다. 시뮬레이터에서 네 대를 전부 30 Hz로
# 돌리면 프레임 복사만으로 CPU가 포화되어 실시간 계수가 0.016까지 떨어진다
# (실측). 카메라를 1 Hz로 낮추면 1.00이 나온다. 병목은 물리가 아니라 영상이다.
#
# 낮춰도 되는 근거는 기획서 5.4에 있다. "판독은 C1 한 대로 완결하고 나머지는
# 확인과 기록을 맡는다." 확인과 기록은 30 Hz가 필요 없다. 그리고 판독조차
# 스트림이 아니라 /perception/.../read 서비스로 한 장씩 찍는 방식이다.
#
# xyz/rpy 규약: 카메라 링크는 ROS 관례를 따른다. 링크 +x = 광축, +y = 좌,
# +z = 상. 광학 프레임(<name>_color_optical_frame)은 링크를 (-pi/2, 0, -pi/2)
# 회전시킨 것으로 +z가 광축이다. Gazebo 센서도 링크 +x를 광축으로 쓴다.
# -----------------------------------------------------------------------------
cameras:
  c1_conveyor:
    model: d435f
    mount: camera_arm_conveyor
    # 판독 위치 (405, 725) 상공. 광축을 수직에서 30도 기울여
    # 로봇의 수직 하강 통로와 라벨 정반사를 피한다. 기울인 방향은 컨베이어
    # 상류(-x)다. 하류(+x)는 팔레트로 가는 로봇 이송 경로와 겹친다.
    # 목표까지 375. 처음에 575로 잡았다가 줄였다. 지상 분해능이 거리에
    # 반비례하므로, 라벨을 키우는 것과 카메라를 내리는 것이 같은 효과다.
    # 둘 다 해서 모듈당 픽셀을 4.6에서 9 이상으로 올린다.
    #
    # 기울기를 20도에서 40도로 키웠다. 로봇이 판독 위치의 박스를 집고
    # 팔레트로 나가는 길이 이 카메라 바로 옆을 지나기 때문이다.
    #
    #   20도  카메라 x=277. 팔이 지나는 평면(x=405)과 128 mm.
    #         집으러 내려가는 것부터 막혔다. MoveIt이 forearm_link /
    #         wrist1_link / wrist2_link 접촉을 잡았다.
    #   30도  카메라 x=218. 집는 것은 되는데, 박스를 물고 나가는 이송
    #         경로가 여전히 9 mm 모자랐다. Pilz PTP는 관절 공간 직선이라
    #         두 끝점이 멀쩡해도 그 사이에서 공구가 뒤로 크게 휜다.
    #         PTP가 버려지면 OMPL 대체 경로로 넘어가는데, 그 꺾인 경로는
    #         시뮬레이터 관절이 못 따라가 실행이 중단되고 박스를 떨군다.
    #   40도  카메라 x=164. 이송 경로 최소 여유 +38 mm. 여기서 멈춘다.
    #
    # 표적까지 거리는 375로 그대로라 지상 분해능은 유지된다. 비스듬해진
    # 만큼 라벨이 0.77배로 짧아 보일 뿐이고, 모듈당 6.4 픽셀이라 디코드에는
    # 넉넉하다(실측 디코드 여유 0.92 이상).
    # 근거는 tools/verify_camera_clearance.py의 실측이다.
    xyz: [0.164, 0.725, 0.507]
    rpy: [0.0, 0.8727, 0.0]      # 수직에서 40도. 광축이 (+x 0.643, -z 0.766)
    tilt_deg: 40.0
    target: [0.405, 0.725, 0.220]   # 박스 상면 = 벨트 180 + 박스 40
    standoff: 0.375                 # 목표까지 광축 거리
    bracket: {kind: drop, from_z: 0.935}   # 컨베이어 팔 아랫면에서 내려 단다
    # 깊이를 끈다. 판독은 호모그래피 한 장으로 끝나고 깊이를 쓰지 않는다.
    # 기획서 5.4 : "박스 높이가 40으로 동일해 상면이 항상 같은 평면이다.
    # ... 깊이 카메라가 필요 없다." 안 쓰는 스트림을 렌더링할 이유가 없다.
    stream: {color_rate: 10, depth: false}
  c2_pallet:
    model: d455
    mount: camera_arm_pallet
    # 팔레트 두 장의 중간 상공. D455 컬러 화각 90도 축(영상 가로)을 y와
    # 맞춰 두 장을 한 대로 덮는다. 기획서 7절 'C2 커버리지' 확인 대상.
    xyz: [0.950, 0.390, 0.900]
    rpy: [0.0, 1.5708, 0.0]      # 수직 하향. 영상 가로축 = 월드 -y
    target: [0.950, 0.390, 0.110]
    standoff: 0.790
    bracket: {kind: drop, from_z: 0.935}   # 팔레트 팔 아랫면에서 내려 단다
    # 적재 확인과 적층 붕괴 감지용. 사이클이 20초인데 초당 30장이 필요 없다.
    stream: {color_rate: 5, depth: true, depth_rate: 2}
  c3_scene:
    model: generic_rgb           # 기종 미정. 확정되면 model만 바꾼다.
    mount: camera_post_1
    xyz: [1.285, 0.725, 0.450]
    rpy: [0.0, 0.39077, -2.74906]  # 셀 중앙 (0.50, 0.40, 0.10)을 겨눈다
    target: [0.500, 0.400, 0.100]
    bracket: {kind: none}          # 기둥 1의 -x 면에 직접 붙인다
    stream: {color_rate: 5, depth: false}   # 기록 사진과 관람 화면
  c4_wrist:
    model: d405
    mount: wrist3_link           # 좌표는 table이 아니라 wrist3_link 기준
    # 그리퍼 몸통 옆. TCP 전방 150 지점으로 15도 모아 겨눈다.
    xyz: [0.0, -0.060, 0.150]
    rpy: [0.0, -1.3086, 1.5708]
    converge_deg: 15.2
    target_local: [0.0, 0.0, 0.3705]   # TCP(0.2205) + 150
    # 광축이 모이는 지점까지 TCP에서 얼마인가. 근접 재시도 때 TCP를 박스
    # 상면 위 이 높이에 세우면 라벨이 화각 한가운데에 온다.
    converge: 0.150
    bracket: {kind: none}
    # 판독 실패 시에만 쓴다. 그때는 반응이 빨라야 하므로 다른 것보다 높인다.
    stream: {color_rate: 10, depth: true, depth_rate: 5}

# -----------------------------------------------------------------------------
# 조명 : 판독 구간 좌우 저각 바 2개
# C1의 광축은 x 방향으로 기울어 있다. 같은 x 방향에서 비추면 라벨 정반사가
# 그대로 렌즈로 돌아온다(기획서 5.4). 그래서 바는 y 양쪽에 두고, 벨트 옆
# 짧은 기둥으로 세워 저각으로 스치게 한다.
# -----------------------------------------------------------------------------
lighting:
  center_x: 0.405                # 판독 위치와 같은 x
  length: 0.300
  y_near: 0.655                  # 로봇 쪽
  y_far: 0.795                   # 반대쪽
  z: 0.330                       # 벨트 상면(180) 위 150
  post_x: [0.255, 0.555]         # 바를 받치는 짧은 기둥 두 쌍
  cone_deg: 70.0
  # 렌더링 노출. 월드 SDF가 그대로 읽는다.
  #
  # 전에는 이 값들이 월드 SDF에 박혀 있었고, 판독 구간이 하얗게 탔다.
  # tools/measure_read_rate.py로 잰 값이 평균 203, 포화 30%였다. 화면의
  # 3분의 1이 255에 붙어 있으면 QR의 검은 모듈과 흰 모듈 경계가 뭉갠다.
  #
  # 원인은 감쇠였다. spot의 감쇠는 1/(constant + linear*d + quadratic*d*d)인데
  # constant가 0.4면 거리 0.4 m에서 배율이 2.05가 된다. 조명이 제 세기보다
  # 두 배로 밝아지는 셈이라 물리적으로 말이 안 된다. constant를 1.0으로
  # 두면 그 자리에서 0.92배가 되어 정상이다.
  #
  # 실물 카메라는 자동 노출이 있어 이런 조명이어도 알아서 조인다. gz 카메라는
  # 없다. 그래서 시뮬레이터에서는 조명 쪽에서 맞춰 줘야 한다.
  # 판독 전용 조명(저각 바 2개)은 걷어냈다. 그러면 판독 구간을 밝히는 것은
  # 천장등과 주변광뿐이다. 아래 값은 **전용 조명이 있던 시절에 낮춰 둔 것**
  # 이라 그대로 두면 안 된다. 그때는 판독 구간이 타서(평균 203, 포화 30%)
  # 낮췄던 것이고, 조명을 걷은 지금은 반대로 너무 어둡다.
  spot_diffuse: 0.55             # 지금은 안 쓴다. 조명을 되살릴 때를 위해 남긴다.
  spot_specular: 0.15
  attenuation: {constant: 1.0, linear: 0.2, quadratic: 0.05}
  ambient: 0.45                  # 씬 주변광
  ceiling_diffuse: 0.85          # 천장등. 이제 이것 하나로 판독 구간을 받친다.

# -----------------------------------------------------------------------------
# 시뮬레이터 설정. 월드 SDF와 conveyor_driver가 함께 읽는다.
# 컨베이어가 단발 렌치로 박스를 미는데, 그 크기가 물리 스텝과 제어 주기의
# 비에 정확히 달려 있다. 두 곳에 따로 적으면 반드시 어긋난다.
simulation:
  physics_step: 0.001            # s. 석션 부착 순간의 상대 자세 정밀도가 여기 달렸다.

# -----------------------------------------------------------------------------
# 운전 시나리오
#
# infeed (기본) : 박스가 컨베이어를 타고 들어온다. 정지 센서에서 서면 판독하고,
#   로봇이 흡착으로 집어 팔레트에 구석부터 하나씩 쌓는다. 팔레트가 차면
#   반출한 것으로 보고 비운 뒤 다음 로트를 받는다. 팔레타이징 데모의 기본형이다.
#
# circulate : 기획서 "순환"의 두 팔레트 방식. 팔레트 1이 차면 로봇이 하나씩
#   꺼내 컨베이어에 되올리고, 판독을 거쳐 팔레트 2에 쌓는다. 보충 없이
#   무인 연속 운전을 보이기 위한 구성이다.
#
# 실제 셀에서는 상류 컨베이어가 박스를 보내 온다. 시뮬레이터는 그 상류를
# 만들지 않는다. 대기 중인 박스를 셀 밖 바닥(staging)에 두었다가 벨트 입구로
# 하나씩 올린다. 셀 경계 밖의 일은 셀의 관심사가 아니다.
scenario:
  mode: infeed
  target_pallet: 1               # infeed에서 쌓는 팔레트
  # 기동 때 박스를 상류 인피드 구간에 줄 세워 만든다. 그다음은 벨트가 한다.
  # 예전에는 셀 밖 바닥에 두었다가 벨트 입구로 옮겼는데, gz의 set_pose가
  # true만 돌려주고 실제로 옮기지 않아 통째로 버렸다.
  #
  # 팔레트가 차면 로봇이 그 팔레트에서 하나씩 꺼내 벨트로 되돌리고
  # 반대쪽 팔레트에 쌓는다(기획서의 순환). 박스를 만들거나 지울 일이 없다.
  unload_pause: 2.0

# -----------------------------------------------------------------------------
# 하드웨어 도착 후 재티칭 대상. 절대 좌표만 여기 모은다.
# -----------------------------------------------------------------------------
tuning:
  home_joints: [0.0, -1.5708, 1.5708, -1.5708, -1.5708, 0.0]
  read_hover_z: 0.320            # 판독 상공. 박스 상면(0.220) 위 100.
  pallet_hover_z: 0.320          # 팔레트 상공 이송 고도
  pick_approach: 0.060           # 접근점은 목표 상면 위 60
  retreat: 0.080                 # 이탈 높이
  cartesian_speed: 0.10          # m/s, 수직 하강/이탈 구간
  transit_scale: 0.35            # 이송 구간 속도 배율
