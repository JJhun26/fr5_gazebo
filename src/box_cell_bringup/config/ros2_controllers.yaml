# ros2_control 컨트롤러 설정. gz_ros2_control, mock, 실물이 이 파일을 함께 쓴다.
#
# update_rate를 100 Hz로 둔 것은 실물 FR5 컨트롤러의 관절 갱신 주기(8 ms 전후,
# TCP 20004)에 맞추기 위해서다. 시뮬레이터만 250 Hz로 돌리면 실물에서
# 재현되지 않는 매끄러움이 나오고, 그러면 시뮬레이터로 검증한 뜻이 없어진다.

# gz_ros2_control 플러그인의 노드. controller_manager와 다른 노드다
# (gz_ros2_control_plugin.cpp의 node_name = "gz_ros_control").
# 같은 파라미터 파일을 읽지만 자기 이름 아래 있는 것만 본다.
# gz_ros2_control 플러그인의 노드. controller_manager와 다른 노드다
# (gz_ros2_control_plugin.cpp의 node_name = "gz_ros_control").
# 같은 파라미터 파일을 읽지만 자기 이름 아래 있는 것만 본다.
gz_ros_control:
  ros__parameters:
    # 위치 명령을 관절 속도 명령으로 바꾸는 이득. gz_system.cpp의 계산은
    #
    #     target_vel = gain * update_rate * (목표 - 현재)
    #
    # 이다. update_rate가 이미 곱해져 있다는 것이 요점이다. 그래서 이 값은
    # "한 제어 주기에 남은 오차의 몇 배를 없앨 것인가"라는 뜻이고,
    # 1.0이 데드비트(한 주기에 정확히 0으로)다.
    #
    #   0.1 (기본값) : 한 주기에 10 %만 없앤다. 속도 v로 따라갈 때 정상
    #                  오차가 v / 10 이다. 이송 속도 1.1 rad/s에서 0.11 rad이라
    #                  아래 trajectory 허용치 0.10을 그냥 넘긴다. 실제로
    #                  "Position Error: -0.100759"로 실행이 중단됐다.
    #   50           : 실효 이득이 5000이 된다. 0.0006 rad만 벌어져도 속도
    #                  명령이 3 rad/s로 관절 한계에 붙는다. 매 주기 방향이
    #                  뒤집혀 팔이 8~18도 폭으로 덜덜 떤다(실측).
    #   0.9          : 한 주기에 90 %를 없앤다. 1.1 rad/s에서 정상 오차가
    #                  0.012 rad이라 시작 허용치 0.02 안에 들어오고,
    #                  1.0을 넘지 않으므로 과도하게 넘어가지 않는다.
    position_proportional_gain: 0.9

controller_manager:
  ros__parameters:
    update_rate: 100


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # 전시 데모는 매번 같은 경로가 나와야 안정적으로 보인다.
    # 그래서 도착 허용 오차(goal)는 0.02로 조인 채로 둔다. 여기가 느슨하면
    # 살짝 어긋난 자세에서 다음 구간을 시작해 궤적이 매번 달라진다.
    #
    # 경로 허용 오차(trajectory)만 0.10에서 0.30으로 연다. 이 값은 "가는
    # 도중" 검사이고, 우리가 겪은 위반은 실제 추종 불량이 아니라 궤적이
    # 바뀌어 물리는 순간의 한 주기짜리 튐이었다.
    #
    # 근거(실측). 관절 하나를 코사인 프로파일로 움직이며 잰 최대 추종 오차 :
    #     0.63 rad/s -> 0.0028    0.94 rad/s -> 0.0050
    #     1.57 rad/s -> 0.0069    2.36 rad/s -> 0.0090
    # 정지 중 드리프트는 0.0000이다. 그런데 이전 이동을 정착시키지 않고
    # 다음 목표를 바로 물리면 같은 속도에서 0.15~0.78까지 튄다. 데모에서 난
    # 위반은 전부 이 모양(0.10~0.15)이었고, 팔이 실제로 경로를 벗어난 게
    # 아니라 새 궤적의 첫 점과 현재 자세가 어긋난 것이다.
    #
    # 0.30은 정상 추종(0.009)의 30배가 넘으므로, 진짜로 못 따라가는 상황은
    # 여전히 걸린다. 위반이 나면 로봇은 들고 있던 박스를 그 자리에 떨구고
    # 그 박스는 비스듬히 얹혀 판독도 파지도 안 된다. 실제 이탈이 아닌 것으로
    # 사이클을 죽이는 쪽이 훨씬 위험하다.
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 0.5
      j1: {trajectory: 0.30, goal: 0.02}
      j2: {trajectory: 0.30, goal: 0.02}
      j3: {trajectory: 0.30, goal: 0.02}
      j4: {trajectory: 0.30, goal: 0.02}
      j5: {trajectory: 0.30, goal: 0.02}
      j6: {trajectory: 0.30, goal: 0.02}
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false

joint_state_broadcaster:
  ros__parameters:
    joints: [j1, j2, j3, j4, j5, j6]
    interfaces: [position, velocity]
